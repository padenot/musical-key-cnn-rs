[package]
name = "musical-key-cnn"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Hardware-accelerated Rust inference for MusicalKeyCNN"

[features]
default = ["cli", "coreml"]
cli = [
    "dep:clap",
    "dep:env_logger",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
]
coreml = ["beat-this/rustnn-coreml"]

[dependencies]
anyhow = "1.0"
beat-this = { git = "https://github.com/padenot/beat-this-rs.git", rev = "de96e25bba0ac924f69116272ab361274a428d51", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = { version = "0.10", optional = true }
rosa = { git = "https://github.com/padenot/rosa.git", rev = "6d2ccde566c66ec4be300f89b68fd287b1e14c07" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[[bin]]
name = "musical-key-cnn"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "inference_benchmark"
required-features = ["cli", "coreml"]
